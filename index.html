.resetting .poteto-reset img{animation:poteto-press .7s both}.resetting .big-reset{animation:press-button .7s both}.resetting .reset-hand{animation:hand-press .7s both}.tibo-cry{position:relative;width:110px;height:153px}.tibo-cry img{width:110px;height:153px;object-fit:contain;transform:none}.resetting .tibo-cry{animation:cry-shake .17s .55s infinite alternate}.tear{position:absolute;top:45px;width:5px;height:11px;border-radius:80% 20% 60% 50%;background:#6bc7f5;opacity:0}.tear.left{left:40px}.tear.right{right:36px}.resetting .tear,.pranked .tear{animation:cry-tear .75s .55s infinite}.tear.right{animation-delay:.8s}.pranked #overlay-title{font-size:21px;letter-spacing:0}

<h1 class="game-title">Can Tibo Capture Grok Bot?</h1><div class="topline"><div class="hud"><div class="stat"><span aria-hidden="true">↻</span><span id="found">0</span><small>/ 5</small></div><div class="stat lives" id="lives" aria-label="3 lives">♥♥♥</div><div class="stat clock" id="timer-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M9 2h6m-3 0v3m0 4v5l3 2"/></svg><span id="time">45</span></div></div><div class="host" id="host"><img src="poteto.png" alt="Poteto"><div class="reset-switch" aria-label="Poteto’s reset button">↻</div></div></div>

<p id="announcements" class="sr-only" aria-live="polite">Five levels. Play as Tibo. Approach Grok Bot using arrows or WASD. Poteto presses Reset when Tibo is three walkable blocks away, making him cry before the next level. 45 seconds each. Avoid cactus traps and wait for gates.</p>
